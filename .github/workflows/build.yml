name: Build and release

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NDK_VERSION: 27.2.12479018

jobs:
  core:
    name: Go core (tests + Android library)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Vet and unit tests
        working-directory: core
        run: |
          go vet ./...
          go test ./...

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      # gomobile/gobind at the version pinned in core/go.mod
      - name: gomobile
        working-directory: core
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Build warpcore.aar
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          gomobile bind -target=android/arm64,android/amd64 -androidapi 24 \
            -javapkg com.iknalos.warpgo -ldflags="-s -w" -o warpcore.aar ./warpcore
          ls -la warpcore.aar

      - name: Upload warpcore.aar
        uses: actions/upload-artifact@v4
        with:
          name: warpcore-aar
          path: core/warpcore.aar
          retention-days: 3

  build:
    name: Signed APK
    needs: core
    runs-on: ubuntu-latest
    env:
      # monotonic per run: the in-app updater installs anything with a higher number
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect warpcore.aar
        uses: actions/download-artifact@v4
        with:
          name: warpcore-aar
          path: app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The key is a secret, not a file in this public repo: whoever holds it can
      # ship an update that installs over WarpGo. The local copy lives outside the repo.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::The SIGNING_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/warpgo.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/warpgo.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          WARP_PRIVATE_KEY: ${{ secrets.WARP_PRIVATE_KEY }}
          WARP_ADDRESS_V6: ${{ secrets.WARP_ADDRESS_V6 }}
          WARP_MASQUE_CONFIG: ${{ secrets.WARP_MASQUE_CONFIG }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # Android only installs an update signed with the same key as the installed
      # app, so a wrongly signed release would just fail on the phone. Refuse it.
      - name: Check it's signed with the WarpGo key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          WANT=$(tr -d ' \r\n' < signing-cert.sha256)
          if [ "$GOT" != "$WANT" ]; then echo "::error::APK signed with $GOT, expected $WANT"; exit 1; fi
          cp "$APK" WarpGo.apk
          ls -la WarpGo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WarpGo-apk
          path: WarpGo.apk
          retention-days: 3

  device-test:
    name: Emulator tests (every option passes data, both tunnels carry traffic)
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect warpcore.aar
        uses: actions/download-artifact@v4
        with:
          name: warpcore-aar
          path: app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WARP_PRIVATE_KEY: ${{ secrets.WARP_PRIVATE_KEY }}
          WARP_ADDRESS_V6: ${{ secrets.WARP_ADDRESS_V6 }}
          WARP_MASQUE_CONFIG: ${{ secrets.WARP_MASQUE_CONFIG }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ci/device-test.sh

      - name: Screenshots, probe results and engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test
          path: shots/
          retention-days: 7

  release:
    needs: [ build, device-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Collect the APK
        uses: actions/download-artifact@v4
        with:
          name: WarpGo-apk
          path: dist

      # Installed apps read releases/latest/download/latest.json and offer this build
      # when its number is higher than theirs; sha256 is of the exact bytes they download.
      - name: Write latest.json
        env:
          N: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SHA=$(sha256sum dist/WarpGo.apk | cut -d' ' -f1)
          NOTES=$(printf '%s\n' "$MSG" | head -n1)
          jq -n --argjson build "$N" --arg version "1.0.$N" --arg sha "$SHA" \
            --arg apk "https://github.com/$REPO/releases/download/v1.0.$N/WarpGo.apk" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "$NOTES" \
            '{build: $build, version: $version, apk: $apk, sha256: $sha, date: $date, notes: $notes}' > dist/latest.json
          cat dist/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          gh release create "v1.0.$N" dist/WarpGo.apk dist/latest.json -R "$GITHUB_REPOSITORY" --latest \
            --title "WarpGo 1.0.$N" \
            --notes "Install WarpGo.apk on your Android phone. Installed copies update themselves: WarpGo shows Update available. Built from $GITHUB_SHA."
